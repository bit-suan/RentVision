[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rentvision-ai"
version = "0.1.0"
description = "AI service for RentVision: property listing assistance and lease document extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "PyMuPDF>=1.24.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
rentvision-ai = "rentvision_ai.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
